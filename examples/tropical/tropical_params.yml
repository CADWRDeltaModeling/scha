# Tropical example parameters
# freqs map labels to tide aliases (scha.tide_registry) or numeric radians per hour.
# The time step is not set here; it comes from the data index (15 min for tropical_sample.csv).

m: 2
n: 4
freqs: 
  D1: D1
  D2: D2
  D3: D3
  D4: D4
# Mapping with a numeric entry (radians per hour):
# freqs: {D1: M1, INERT: 0.265, D2: M2}

rho: 0.9925
sigma2_eps: 2.772368e-05
sigma2_zeta: 1.398299e-10
# sigma2_kappa must be provided and match the freqs (either scalar, single-item list, list of same length, or mapping)
sigma2_kappa: [ 1.307158e-13,1.309000e-13,1.312995e-13,1.291274e-13]
sigma2_diffuse: 1000.